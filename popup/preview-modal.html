<!-- Preview Modal Template -->
<!-- This will be injected into popup.html dynamically -->

<div id="preview-modal" class="preview-modal hidden">
    <div class="preview-overlay"></div>

    <div class="preview-container">
        <!-- Header -->
        <div class="preview-header">
            <div class="preview-title-section">
                <div class="preview-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                <div>
                    <h2>Preview Auto-Fill</h2>
                    <p class="preview-subtitle">Review and edit field mappings before filling</p>
                </div>
            </div>
            <button class="preview-close" id="preview-close-btn" title="Close">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Stats Bar -->
        <div class="preview-stats">
            <div class="preview-stat">
                <span class="stat-label">Total Fields</span>
                <span class="stat-value" id="preview-total-fields">0</span>
            </div>
            <div class="preview-stat">
                <span class="stat-label">Will Fill</span>
                <span class="stat-value success" id="preview-filled-count">0</span>
            </div>
            <div class="preview-stat">
                <span class="stat-label">Avg Confidence</span>
                <span class="stat-value" id="preview-avg-confidence">0%</span>
            </div>
        </div>

        <!-- Confidence Filter -->
        <div class="preview-filter">
            <label class="filter-label">Show:</label>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">
                    All Fields
                    <span class="filter-badge" id="filter-badge-all">0</span>
                </button>
                <button class="filter-btn" data-filter="high">
                    🟢 High (90%+)
                    <span class="filter-badge" id="filter-badge-high">0</span>
                </button>
                <button class="filter-btn" data-filter="medium">
                    🟡 Medium (70-90%)
                    <span class="filter-badge" id="filter-badge-medium">0</span>
                </button>
                <button class="filter-btn" data-filter="low">
                    🔴 Low (<70%)
                    <span class="filter-badge" id="filter-badge-low">0</span>
                </button>
            </div>
        </div>

        <!-- Mappings List -->
        <div class="preview-mappings" id="preview-mappings-list">
            <!-- Mappings will be dynamically inserted here -->
            <!-- Template:
            <div class="mapping-item" data-confidence="high">
                <div class="mapping-checkbox">
                    <input type="checkbox" checked />
                </div>
                <div class="mapping-content">
                    <div class="mapping-field">
                        <span class="field-label">Full Name</span>
                        <span class="field-type">text</span>
                    </div>
                    <div class="mapping-arrow">→</div>
                    <div class="mapping-value">
                        <input type="text" value="John Smith" class="editable-value" />
                    </div>
                    <div class="mapping-confidence high">
                        <span class="confidence-badge">🟢 98%</span>
                    </div>
                </div>
                <button class="mapping-edit-btn">
                    <svg>...</svg>
                </button>
            </div>
            -->
        </div>

        <!-- Warning Messages -->
        <div class="preview-warnings" id="preview-warnings">
            <!-- Warnings will be inserted here -->
        </div>

        <!-- Actions -->
        <div class="preview-actions">
            <button class="btn btn-secondary" id="preview-cancel-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                Cancel
            </button>
            <button class="btn btn-secondary" id="preview-edit-all-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                Edit Mappings
            </button>
            <button class="btn btn-primary" id="preview-fill-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Fill Form
                <span class="btn-badge" id="preview-fill-count">0 fields</span>
            </button>
        </div>
    </div>
</div>
